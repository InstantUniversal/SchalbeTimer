<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RV Schalbe Athletic Timer</title>

<style>
body {
  background:#0a2a66;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.timer {
  width:360px;
  border-radius:18px;
  border:2px solid #0a2a66;
  background:#ffd400;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  padding:2rem;
  text-align:center;
  color:#0a2a66;
}

h2 { margin:0 0 1rem 0; }
.status { font-weight:bold; font-size:1.2rem; margin-bottom:0.5rem; }
.time { font-size:4.5rem; font-weight:bold; margin:0.5rem 0; }
.total-time { font-weight:bold; margin-bottom:1rem; }
button, select { padding:0.6rem; margin:0.3rem; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
.start { background:#0a2a66; color:#ffd400; }
.pause { background:#f1c40f; }
.reset { background:#e74c3c; color:#fff; }

.motivation {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:2.6rem;
  font-weight:900;
  color:#e60000;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  z-index:9999;
  text-shadow:3px 3px 8px rgba(0,0,0,0.5);
}

.motivation.show {
  animation:motivate 2.5s ease-out forwards;
}

@keyframes motivate {
  0%   {opacity:0; transform:translate(-50%,-50%) scale(0.6) rotate(var(--rot));}
  25%  {opacity:1;}
  70%  {opacity:1; transform:translate(-50%,-50%) scale(1.6) rotate(var(--rot));}
  100% {opacity:0; transform:translate(-50%,-50%) scale(1.8) rotate(var(--rot));}
}

.donate { margin-top:1rem; font-size:0.85rem; }
.donate button { background:#0a2a66; color:#ffd400; padding:0.5rem 0.8rem; border-radius:6px; cursor:pointer; line-height:1.2; }
</style>
</head>

<body>

<div class="motivation" id="motivation"></div>

<div class="timer">
  <h2>RV Schalbe Athletic Timer</h2>

  <select id="interval">
    <option value="30/30">30 / 30 Sekunden</option>
    <option value="60/30">60 / 30 Sekunden</option>
    <option value="60/60" selected>60 / 60 Sekunden</option>
    <option value="90/90">90 / 90 Sekunden</option>
  </select>
  
  <div class="status" id="status"></div>
  <div class="time" id="display">01:00</div>
  <div class="total-time" id="totalDisplay">Gesamtzeit: <span id="total">00:00</span></div>

  <div>
    <button class="start" id="btnStart">Start</button>
    <button class="pause" id="btnPause">Pause</button>
    <button class="reset" id="btnReset">Reset</button>
  </div>

  <div class="donate">
    <form action="https://www.paypal.com/donate" method="post" target="_blank">
      <input type="hidden" name="hosted_button_id" value="HIER_DEINE_BUTTON_ID">
      <button type="submit">Like what you see? ☺️<br>☕ Buy me a coffee</button>
    </form>
  </div>
</div>

<script>
// Sprache erkennen
const lang = navigator.language.slice(0,2);

// Motivationssprüche
const slogans = {
  de: [
    "Quäl dich du Sau 🐖",
    "Schmerz vergeht – Stolz bleibt!",
    "LOS, NICHT NACHLASSEN!",
    "Der Berg lügt nicht!",
    "Beine schreien – Mund halten!",
    "Schweiß ist flüssiger Applaus 💦"
  ],
  en: [
    "Push yourself!",
    "Pain fades – pride stays!",
    "No excuses!",
    "The mountain doesn't lie!",
    "Legs scream – stay quiet!",
    "Sweat is liquid applause 💦"
  ]
};
const motLang = slogans[lang] ? lang : "en";

// Timer Variablen
let work = 60, rest = 60, timeLeft = 60;
let isWork = true, timer = null, total = 0;
let halfTime = 30, motivationShown = false;

// DOM
const display = document.getElementById("display");
const status = document.getElementById("status");
const motivation = document.getElementById("motivation");
const totalSpan = document.getElementById("total");
const interval = document.getElementById("interval");
const btnStart = document.getElementById("btnStart");
const btnPause = document.getElementById("btnPause");
const btnReset = document.getElementById("btnReset");

// Hilfsfunktionen
function fmt(sec){
  return String(Math.floor(sec/60)).padStart(2,'0') + ":" + String(sec%60).padStart(2,'0');
}

function update(){
  display.textContent = fmt(timeLeft);
  totalSpan.textContent = fmt(total);
}

function showMotivation(){
  const angle = Math.floor(Math.random()*151)-75;
  motivation.style.setProperty("--rot", angle+"deg");
  motivation.textContent = slogans[motLang][Math.floor(Math.random()*slogans[motLang].length)];
  motivation.classList.remove("show");
  void motivation.offsetWidth;
  motivation.classList.add("show");
}

// Audio-Funktion für Pieptöne
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(duration=100, frequency=1000, volume=0.3){
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.frequency.value = frequency;
  oscillator.type = "sine";
  gainNode.gain.value = volume;
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + duration/1000);
}

// Timer laden
function load(){
  [work,rest] = interval.value.split("/").map(Number);
  timeLeft = work;
  isWork = true;
  halfTime = Math.floor(work/2);
  motivationShown = false;
  status.textContent = (lang==="de") ? "Quäl dich!" : "Work";
  update();
}

// Timerfunktionen
function start(){
  if(timer) return;
  timer = setInterval(()=>{
    timeLeft--;
    total++;

    // Halbzeit Motivationsspruch
    if(isWork && !motivationShown && timeLeft === halfTime){
      showMotivation();
      motivationShown = true;
    }

    // Pieptöne in den letzten 5 Sekunden
    if(isWork && timeLeft > 0 && timeLeft <= 5){
      // vier kurze Töne pro Sekunde
      for(let i=0;i<4;i++){
        setTimeout(()=>beep(50, 1200, 0.3), i*200);
      }
    }

    // Intervallende längerer Ton
    if(isWork && timeLeft === 0){
      beep(400, 800, 0.5); // langer Piepton
    }

    if(timeLeft === 0){
      isWork = !isWork;
      timeLeft = isWork ? work : rest;
      status.textContent = isWork ? ((lang==="de") ? "Quäl dich!" : "Work") : ((lang==="de") ? "Gönn dir" : "Rest");
      if(isWork){
        halfTime = Math.floor(work/2);
        motivationShown = false;
      }
    }
    update();
  },1000);
}

function pause(){ clearInterval(timer); timer=null; }
function reset(){ pause(); total=0; load(); }

// EventListener
btnStart.addEventListener("click", start);
btnPause.addEventListener("click", pause);
btnReset.addEventListener("click", reset);
interval.addEventListener("change", load);

load();
</script>

</body>
</html>
